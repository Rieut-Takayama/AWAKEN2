<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>AWAKEN2 - メインダッシュボード</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto+Mono:wght@300;400;500&family=M+PLUS+1+Code:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="/js/header.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'M PLUS 1 Code', 'Noto Sans JP', 'Roboto Mono', monospace;
            background: #000000;
            background-image: radial-gradient(rgba(0, 255, 0, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
            color: #00ff41;
            overflow-x: hidden;
        }

        .matrix-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.3;
        }

        .header {
            background: rgba(0, 0, 0, 0.9);
            border-bottom: 2px solid #00ff41;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-family: 'Orbitron', monospace;
            font-size: 1.8rem;
            font-weight: 900;
            color: #00ff41;
            text-decoration: none;
            text-shadow: 0 0 10px #00ff41;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #00ff41; }
            to { text-shadow: 0 0 20px #00ff41, 0 0 30px #00ff41; }
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .current-score {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.1rem;
            font-weight: 500;
            color: #00ff41;
        }

        .score-badge {
            background: rgba(0, 255, 65, 0.2);
            color: #00ff41;
            border: 1px solid #00ff41;
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
            text-shadow: 0 0 5px #00ff41;
        }

        .settings-btn {
            background: rgba(0, 255, 65, 0.1);
            color: #00ff41;
            border: 1px solid #00ff41;
            padding: 0.5rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            font-family: 'Roboto Mono', monospace;
            text-transform: uppercase;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .settings-btn:hover {
            background: rgba(0, 255, 65, 0.2);
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
        }

        .logout-btn {
            background: rgba(0, 255, 65, 0.1);
            color: #00ff41;
            border: 1px solid #00ff41;
            padding: 0.5rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            font-family: 'Roboto Mono', monospace;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(0, 255, 65, 0.2);
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 10;
        }

        .dashboard-title {
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 2rem;
            color: #00ff41;
            text-shadow: 0 0 10px #00ff41;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .add-currency-section {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #00ff41;
            border-radius: 4px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.1);
        }

        .add-currency-form {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .currency-input {
            flex: 1;
            padding: 0.8rem 1rem;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #00ff41;
            border-radius: 4px;
            color: #00ff41;
            font-family: 'Roboto Mono', monospace;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .currency-input:focus {
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
            background: rgba(0, 0, 0, 0.9);
        }

        .currency-input::placeholder {
            color: rgba(0, 255, 65, 0.5);
        }

        .add-btn {
            background: rgba(0, 255, 65, 0.1);
            color: #00ff41;
            border: 1px solid #00ff41;
            padding: 0.8rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            font-family: 'Roboto Mono', monospace;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .add-btn:hover {
            background: rgba(0, 255, 65, 0.2);
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
        }

        .currency-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .currency-card {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #00ff41;
            border-radius: 4px;
            padding: 1.5rem;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .currency-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.3);
        }

        .high-score-card {
            border-color: #ff0040;
            box-shadow: 0 0 30px rgba(255, 0, 64, 0.3);
            animation: danger-pulse 2s infinite;
        }

        @keyframes danger-pulse {
            0%, 100% { 
                border-color: #ff0040;
                box-shadow: 0 0 30px rgba(255, 0, 64, 0.3);
            }
            50% { 
                border-color: #ff4070;
                box-shadow: 0 0 40px rgba(255, 0, 64, 0.5);
            }
        }

        .medium-score-card {
            border-color: #ffaa00;
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.2);
        }

        .monitoring-status {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin-bottom: 2rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 65, 0.3);
            border-radius: 4px;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .status-label {
            color: rgba(0, 255, 65, 0.7);
            font-size: 0.9rem;
            text-transform: uppercase;
        }
        
        .status-value {
            color: #00ff41;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
        }
        
        .status-value.on {
            color: #00ff41;
        }
        
        .status-value.off {
            color: #ff0040;
        }

        .currency-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.5rem;
            min-height: 2.5rem;
        }

        .currency-name {
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            font-weight: 700;
            color: #00ff41;
            text-shadow: 0 0 5px #00ff41;
        }

        .currency-price {
            font-family: 'Roboto Mono', monospace;
            font-size: 0.9rem;
            font-weight: 500;
            color: #00ff41;
            line-height: 1.2;
            word-break: break-all;
            max-width: 50%;
        }

        .score-display {
            text-align: center;
            margin: 1rem 0;
        }

        .score-value {
            font-family: 'Orbitron', monospace;
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            color: #00ff41;
            text-shadow: 0 0 10px #00ff41;
        }

        .high-score-card .score-value {
            color: #ff0040;
            text-shadow: 0 0 15px #ff0040;
        }

        .medium-score-card .score-value {
            color: #ffaa00;
            text-shadow: 0 0 10px #ffaa00;
        }

        .score-label {
            font-family: 'Roboto Mono', monospace;
            font-size: 0.8rem;
            opacity: 0.8;
            color: #00ff41;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .mini-chart {
            height: 40px;
            margin: 1rem 0;
            position: relative;
            overflow: hidden;
        }
        
        .chart-line {
            stroke: #00ff41;
            stroke-width: 2;
            fill: none;
            filter: drop-shadow(0 0 3px #00ff41);
        }
        
        .chart-area {
            fill: rgba(0, 255, 65, 0.1);
        }
        
        .chart-point {
            fill: #ff0040;
            stroke: #ff0040;
            stroke-width: 2;
            filter: drop-shadow(0 0 5px #ff0040);
        }
        
        .technical-indicators {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(0, 255, 65, 0.2);
        }
        
        .indicator-item {
            text-align: center;
        }
        
        .indicator-label {
            font-size: 0.7rem;
            color: rgba(0, 255, 65, 0.6);
            text-transform: uppercase;
        }
        
        .indicator-value {
            font-size: 0.9rem;
            font-weight: 700;
            color: #00ff41;
            font-family: 'Orbitron', monospace;
        }
        
        .indicator-value.danger {
            color: #ff0040;
        }
        
        .indicator-value.warning {
            color: #ffaa00;
        }
        
        .indicator-value.good {
            color: #00ff41;
            text-shadow: 0 0 5px #00ff41;
        }

        .trend-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
            font-family: 'Roboto Mono', monospace;
            font-weight: 500;
        }

        .trend-up {
            color: #00ff41;
        }

        .trend-down {
            color: #ff0040;
        }

        .last-updated {
            text-align: center;
            color: rgba(0, 255, 65, 0.6);
            font-family: 'Roboto Mono', monospace;
            font-size: 0.8rem;
            margin-top: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .loading-spinner {
            display: inline-block;
            width: 15px;
            height: 15px;
            border: 2px solid rgba(0, 255, 65, 0.2);
            border-top: 2px solid #00ff41;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .high-score-alert {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 4px;
            padding: 1rem;
            margin-bottom: 2rem;
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-family: 'Roboto Mono', monospace;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        
        .high-score-alert.danger {
            background: rgba(255, 0, 64, 0.1);
            border: 1px solid #ff0040;
            color: #ff0040;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 50% { 
                opacity: 1; 
                box-shadow: 0 0 20px rgba(255, 0, 64, 0.3);
            }
            51%, 100% { 
                opacity: 0.7; 
                box-shadow: 0 0 10px rgba(255, 0, 64, 0.1);
            }
        }

        .notification-history {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 65, 0.3);
            border-radius: 4px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .history-title {
            font-family: 'Orbitron', monospace;
            font-size: 1.1rem;
            color: #00ff41;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }
        
        .notification-list {
            max-height: 200px;
            overflow-y: auto;
        }
        
        .notification-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            background: rgba(0, 255, 65, 0.05);
            border: 1px solid rgba(0, 255, 65, 0.2);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .notification-item:hover {
            background: rgba(0, 255, 65, 0.1);
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.3);
        }
        
        .notification-time {
            color: rgba(0, 255, 65, 0.7);
            font-size: 0.85rem;
        }
        
        .notification-symbol {
            color: #00ff41;
            font-weight: 700;
        }
        
        .notification-score {
            color: #ff0040;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
        }
        
        .no-notifications {
            text-align: center;
            color: rgba(0, 255, 65, 0.5);
            padding: 2rem;
        }

        /* ハンバーガーメニュー */
        .hamburger-menu {
            display: none;
            cursor: pointer;
            padding: 0.5rem;
            z-index: 1001;
        }
        
        .hamburger-menu span {
            display: block;
            width: 25px;
            height: 3px;
            background: #00ff41;
            margin: 5px 0;
            transition: all 0.3s ease;
            box-shadow: 0 0 5px #00ff41;
        }
        
        .hamburger-menu.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        
        .hamburger-menu.active span:nth-child(2) {
            opacity: 0;
        }
        
        .hamburger-menu.active span:nth-child(3) {
            transform: rotate(-45deg) translate(7px, -6px);
        }

        @media (max-width: 768px) {
            .header {
                flex-wrap: wrap;
                padding: 1rem;
            }
            
            .hamburger-menu {
                display: block;
            }
            
            .header-info {
                display: none;
                width: 100%;
                flex-direction: column;
                gap: 1rem;
                margin-top: 1rem;
                padding-top: 1rem;
                border-top: 1px solid rgba(0, 255, 65, 0.3);
            }
            
            .header-info.active {
                display: flex;
            }
            
            .settings-btn, .logout-btn {
                width: 100%;
                text-align: center;
                padding: 0.8rem;
            }
            
            .currency-grid {
                grid-template-columns: 1fr;
            }
            
            .monitoring-status {
                flex-wrap: wrap;
                gap: 1rem;
            }
            
            .technical-indicators {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <script src="/matrix-rain.js"></script>
    
    <header class="header">
        <!-- 共通ヘッダーがJSで挿入されます -->
    </header>

    <main class="main-container">
        
        <!-- システムステータス -->
        <div style="background: rgba(0, 255, 65, 0.05); border: 1px solid var(--matrix-green); border-radius: 8px; padding: 1.5rem; margin-bottom: 2rem;">
            <h3 style="color: var(--matrix-green); font-size: 1.1rem; margin-bottom: 1rem; font-family: 'Orbitron', monospace;">📡 システムステータス</h3>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
                <div style="text-align: center;">
                    <div style="font-size: 0.9rem; color: rgba(0, 255, 65, 0.7);">AI分析</div>
                    <div id="aiStatus" style="font-size: 1.2rem; font-weight: bold; color: #00ff41;">✅ 稼働中</div>
                </div>
                <div style="text-align: center;">
                    <div style="font-size: 0.9rem; color: rgba(0, 255, 65, 0.7);">監視通貨</div>
                    <div id="monitoringCount" style="font-size: 1.2rem; font-weight: bold; color: #00ff41;">0通貨</div>
                </div>
                <div style="text-align: center;">
                    <div style="font-size: 0.9rem; color: rgba(0, 255, 65, 0.7);">買い度閾値</div>
                    <div id="thresholdStatus" style="font-size: 1.2rem; font-weight: bold; color: #00ff41;">75点以上</div>
                </div>
                <div style="text-align: center;">
                    <div style="font-size: 0.9rem; color: rgba(0, 255, 65, 0.7);">詳細通知</div>
                    <div id="alertsStatus" style="font-size: 1.2rem; font-weight: bold; color: #ffaa00;">0個有効</div>
                </div>
            </div>
        </div>
        
        <div id="highScoreAlert" class="high-score-alert">
            <span id="alertContent"><strong>📊 監視中</strong><br>投資チャンスを分析しています</span>
        </div>

        <!-- 監視状態 -->
        <div class="monitoring-status">
            <div class="status-item">
                <span class="status-label">通知設定</span>
                <span id="notificationStatus" class="status-value">75点以上</span>
            </div>
            <div class="status-item">
                <span class="status-label">次回通知可能</span>
                <span id="nextNotification" class="status-value">--分後</span>
            </div>
        </div>

        <div class="currency-grid" id="currencyGrid">
            <!-- 動的に生成される通貨カード -->
        </div>

        <!-- アクションボタン群 -->
        <div style="text-align: center; margin: 2rem 0;">
            <button onclick="analyzeNow()" style="
                background: linear-gradient(45deg, rgba(255, 170, 0, 0.3), rgba(255, 0, 64, 0.3));
                color: #ffaa00;
                border: 2px solid #ffaa00;
                padding: 1rem 3rem;
                border-radius: 8px;
                cursor: pointer;
                font-size: 1.2rem;
                font-weight: 700;
                font-family: 'Orbitron', monospace;
                text-transform: uppercase;
                letter-spacing: 2px;
                transition: all 0.3s ease;
                box-shadow: 0 0 30px rgba(255, 170, 0, 0.5);
                display: inline-flex;
                align-items: center;
                gap: 1rem;
            " onmouseover="this.style.boxShadow='0 0 50px rgba(255, 170, 0, 0.8)'; this.style.transform='scale(1.05)'" onmouseout="this.style.boxShadow='0 0 30px rgba(255, 170, 0, 0.5)'; this.style.transform='scale(1)'">
                <span style="font-size: 1.5rem;">🔥</span>
                今すぐ全通貨を分析
                <span style="font-size: 0.8rem; opacity: 0.8;">（約0.1円）</span>
            </button>
            <div style="margin-top: 0.5rem; color: rgba(255, 170, 0, 0.7); font-size: 0.85rem;">
                Claude AIで詳細分析を強制実行 • 通常は5秒ごとにテクニカル指標のみ自動計算
            </div>
        </div>

        <!-- 高スコア履歴とAI分析 -->
        <div class="notification-history">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h3 class="history-title">買いチャンス履歴 <span style="font-size: 0.8rem; color: rgba(0, 255, 65, 0.6);">（クリックでAI分析詳細）</span></h3>
                <select id="historyFilter" onchange="filterHistory()" style="
                    background: rgba(0, 0, 0, 0.5);
                    border: 1px solid rgba(0, 255, 65, 0.5);
                    color: #00ff41;
                    padding: 0.3rem 0.8rem;
                    border-radius: 4px;
                    font-family: 'Roboto Mono', monospace;
                ">
                    <option value="today">本日</option>
                    <option value="week">過去7日間</option>
                    <option value="month">過去30日間</option>
                </select>
            </div>
            <div id="notificationList" class="notification-list">
                <div class="no-notifications">選択期間中の高スコア（75点以上）履歴がありません</div>
            </div>
        </div>
        
        <!-- AI分析詳細モーダル -->
        <div id="aiAnalysisModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); z-index: 10000; overflow-y: auto; padding: 1rem;">
            <div style="max-width: 900px; margin: 2rem auto; background: rgba(0, 0, 0, 0.98); border: 2px solid #00ff41; border-radius: 8px; padding: 2rem; position: relative; box-shadow: 0 0 50px rgba(0, 255, 65, 0.3);">
                <button onclick="closeAIAnalysis()" style="position: absolute; top: 1rem; right: 1rem; background: rgba(255, 0, 64, 0.3); border: 1px solid #ff0040; color: #ff0040; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-weight: bold;">✕ 閉じる</button>
                
                <h2 style="font-family: 'Orbitron', monospace; color: #00ff41; margin-bottom: 1.5rem; text-shadow: 0 0 10px #00ff41; font-size: 1.5rem;">🤖 AI詳細分析レポート</h2>
                
                <div id="aiAnalysisContent" style="max-height: 70vh; overflow-y: auto;">
                    <!-- 動的に生成されるAI分析内容 -->
                </div>
            </div>
        </div>
        
        <div class="last-updated">
            最終更新: <span id="lastUpdated"></span>
            <span class="loading-spinner" id="loadingSpinner" style="display: none;"></span>
        </div>
    </main>

    <script>
        // toggleMobileMenu関数はheader.js内に定義済み
        
        // 認証チェック
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/login';
            // ここで処理を止める
            throw new Error('No authentication token');
        }

        // ログアウト機能
        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/';
        }

        // 設定から取得する監視銘柄
        let watchedCurrencies = [];
        let settings = {
            threshold: 75,
            notificationInterval: 60,
            notificationsEnabled: true
        };
        
        // 通知履歴
        let notificationHistory = [];

        // スパークライン生成（最近10回分のみ表示）
        function generateSparkline(data, hasHighScore) {
            const width = 200;
            const height = 40;
            const padding = 2;
            
            // 最近10回分のデータのみを使用
            const recentData = data.slice(-10);
            
            const max = Math.max(...recentData);
            const min = Math.min(...recentData);
            const range = max - min || 1; // ゼロ除算を防ぐ
            
            const points = recentData.map((value, index) => {
                const x = (index / (recentData.length - 1)) * (width - 2 * padding) + padding;
                const y = height - ((value - min) / range) * (height - 2 * padding) - padding;
                return `${x},${y}`;
            }).join(' ');
            
            const highScorePoints = hasHighScore ? recentData.map((value, index) => {
                if (value >= settings.threshold) {
                    const x = (index / (recentData.length - 1)) * (width - 2 * padding) + padding;
                    const y = height - ((value - min) / range) * (height - 2 * padding) - padding;
                    return `<circle class="chart-point" cx="${x}" cy="${y}" r="2"/>`;
                }
                return '';
            }).join('') : '';
            
            return `
                <svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
                    <polyline class="chart-line" points="${points}"/>
                    ${highScorePoints}
                </svg>
            `;
        }

                            ${technicalIndicators.rsi !== undefined ? `
                            <div style="margin-bottom: 1rem;">
                                <div style="color: #ffaa00; font-weight: bold; margin-bottom: 0.5rem;">📊 テクニカル指標</div>
                                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; font-size: 0.85rem;">
                                    <div style="background: rgba(0, 255, 65, 0.05); padding: 0.5rem; border-radius: 4px;">
                                        <div style="color: rgba(0, 255, 65, 0.6);">RSI</div>
                                        <div style="color: #00ff41; font-weight: bold;">${technicalIndicators.rsi}</div>
                                    </div>
                                    <div style="background: rgba(0, 255, 65, 0.05); padding: 0.5rem; border-radius: 4px;">
                                        <div style="color: rgba(0, 255, 65, 0.6);">MACD</div>
                                        <div style="color: ${technicalIndicators.macdSignal === 'bullish' ? '#00ff41' : '#ff0040'}; font-weight: bold;">
                                            ${technicalIndicators.macdSignal === 'bullish' ? '強気' : '弱気'}
                                        </div>
                                    </div>
                                    <div style="background: rgba(0, 255, 65, 0.05); padding: 0.5rem; border-radius: 4px;">
                                        <div style="color: rgba(0, 255, 65, 0.6);">BB位置</div>
                                        <div style="color: #00ff41; font-weight: bold;">${technicalIndicators.bbPosition}%</div>
                                    </div>
                                </div>
                            </div>
                            ` : ''}
                            
                            <!-- 主要判断根拠 -->
                            ${keyFactors.length > 0 ? `
                            <div style="margin-bottom: 1rem;">
                                <div style="color: #ffaa00; font-weight: bold; margin-bottom: 0.5rem;">🎯 主要判断根拠</div>
                                <ul style="color: rgba(0, 255, 65, 0.8); font-size: 0.85rem; padding-left: 1.5rem; line-height: 1.6;">
                                    ${keyFactors.map(factor => `<li>${factor}</li>`).join('')}
                                </ul>
                            </div>
                            ` : ''}
                            
                            <!-- 取引戦略 -->
                            ${strategy.entryPrice ? `
                            <div style="background: rgba(255, 170, 0, 0.05); border: 1px solid rgba(255, 170, 0, 0.3); padding: 1rem; border-radius: 4px;">
                                <div style="color: #ffaa00; font-weight: bold; margin-bottom: 0.8rem; font-size: 1rem;">💰 推奨取引戦略</div>
                                
                                <!-- エントリー戦略 -->
                                <div style="margin-bottom: 0.8rem;">
                                    <div style="color: rgba(0, 255, 65, 0.9); font-weight: bold; margin-bottom: 0.3rem;">📍 エントリーポイント</div>
                                    <div style="color: rgba(0, 255, 65, 0.7); font-size: 0.85rem;">
                                        現在価格: $${strategy.entryPrice.toLocaleString()}<br>
                                        ${strategy.riskManagement}
                                    </div>
                                </div>
                                
                                <!-- ナンピン戦略 -->
                                ${strategy.dcaLevels && strategy.dcaLevels.length > 0 ? `
                                <div style="margin-bottom: 0.8rem;">
                                    <div style="color: rgba(0, 255, 65, 0.9); font-weight: bold; margin-bottom: 0.3rem;">📉 ナンピン（DCA）推奨価格</div>
                                    <div style="font-size: 0.85rem;">
                                        ${strategy.dcaLevels.map((level, index) => `
                                            <div style="color: rgba(0, 255, 65, 0.7); margin-bottom: 0.2rem;">
                                                ${index + 1}. $${level.price.toFixed(2)} (${level.percentage}%) - ${level.amount}
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                                ` : ''}
                                
                                <!-- 利確目標 -->
                                ${strategy.takeProfitLevels && strategy.takeProfitLevels.length > 0 ? `
                                <div style="margin-bottom: 0.8rem;">
                                    <div style="color: rgba(0, 255, 65, 0.9); font-weight: bold; margin-bottom: 0.3rem;">🎯 利確目標</div>
                                    <div style="font-size: 0.85rem;">
                                        ${strategy.takeProfitLevels.map(tp => `
                                            <div style="color: rgba(0, 255, 65, 0.7); margin-bottom: 0.2rem;">
                                                第${tp.level}目標: $${tp.price.toFixed(2)} (+${tp.percentage}%) - ${tp.action}
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                                ` : ''}
                                
                                <!-- ストップロス -->
                                <div style="margin-bottom: 0.8rem;">
                                    <div style="color: #ff0040; font-weight: bold; margin-bottom: 0.3rem;">🛑 ストップロス</div>
                                    <div style="color: rgba(255, 0, 64, 0.8); font-size: 0.85rem;">
                                        $${strategy.stopLoss.toFixed(2)} (-3%)
                                    </div>
                                </div>
                                
                                <!-- 想定保有期間 -->
                                <div>
                                    <div style="color: rgba(0, 255, 65, 0.9); font-weight: bold; margin-bottom: 0.3rem;">⏱ 想定保有期間</div>
                                    <div style="color: rgba(0, 255, 65, 0.7); font-size: 0.85rem;">
                                        ${strategy.timeframe}
                                    </div>
                                </div>
                            </div>
                            ` : ''}
                        </div>
                        `;
                    }).join('')}
                    
                    <!-- 免責事項 -->
                    <div style="text-align: center; margin-top: 2rem; padding: 1rem; background: rgba(255, 0, 64, 0.05); border: 1px solid rgba(255, 0, 64, 0.3); border-radius: 4px;">
                        <p style="color: rgba(255, 0, 64, 0.8); font-size: 0.85rem; margin: 0;">
                            ⚠️ これは参考情報です。投資判断は自己責任でお願いします。<br>
                            必ず余剰資金で投資を行い、リスク管理を徹底してください。
                        </p>
                    </div>
                </div>
            `;
            
            modal.style.display = 'block';
        }
        
        // AI分析モーダルを閉じる
        function closeAIAnalysis() {
            const modal = document.getElementById('aiAnalysisModal');
            modal.style.display = 'none';
        }
        
        // モーダル外クリックで閉じる
        document.getElementById('aiAnalysisModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeAIAnalysis();
            }
        });
        
        // 実際のAPIからデータを取得
        async function fetchRealTimeData() {
            const spinner = document.getElementById('loadingSpinner');
            spinner.style.display = 'inline-block';
            
            try {
                // 監視銘柄の実データを取得
                const promises = watchedCurrencies.map(async (currency) => {
                    const response = await fetch(`/api/realtime/analyze/${currency.symbol}`, {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    
                    if (response.ok) {
                        const result = await response.json();
                        return result.data;
                    }
                    return null;
                });
                
                const results = await Promise.all(promises);
                
                // 取得したデータで更新
                watchedCurrencies = results.filter(data => data !== null);
                
                // 高スコアの通知を処理
                watchedCurrencies.forEach(currency => {
                    if (currency.score >= settings.threshold) {
                        // 通知履歴に追加（重複チェック）
                        const exists = notificationHistory.some(n => 
                            n.symbol === currency.symbol && 
                            new Date().getTime() - new Date(n.timestamp).getTime() < 60000
                        );
                        
                        if (!exists) {
                            notificationHistory.unshift({
                                time: new Date().toLocaleTimeString('ja-JP', {hour: '2-digit', minute: '2-digit'}),
                                symbol: currency.symbol,
                                score: currency.score,
                                detailData: {
                                    price: currency.price,
                                    change: currency.change24h,
                                    rsiScore: currency.indicators?.rsi?.score || 0,
                                    macdScore: currency.indicators?.macd?.score || 0,
                                    bbScore: currency.indicators?.bb?.score || 0,
                                    timestamp: new Date().toISOString()
                                }
                            });
                            notificationHistory = notificationHistory.slice(0, 10);
                        }
                    }
                });
                
                renderCurrencies();
                renderNotificationHistory();
                updateLastUpdated();
                updateNextNotificationTime();
                
            } catch (error) {
                console.error('データ取得エラー:', error);
                // エラー時は空の配列を保持してエラーメッセージを表示
                const grid = document.getElementById('currencyGrid');
                if (watchedCurrencies.length === 0) {
                    grid.innerHTML = '<div style="text-align: center; color: rgba(0, 255, 65, 0.6); padding: 2rem;">データを取得中...</div>';
                }
            } finally {
                spinner.style.display = 'none';
            }
        }
        
        // 自動更新を削除 - 手動リフレッシュのみ
        // 初回データ取得
        fetchRealTimeData();
        
        // 個別通貨のAI分析
        async function analyzeSingleCurrency(symbol, currentPrice) {
            const btn = event.target;
            btn.disabled = true;
            btn.innerHTML = '🔄 分析中...';
            
            try {
                // 個別通貨の強制AI分析を実行
                const response = await fetch('/api/analyze/force', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ 
                        symbols: [symbol.replace('/', '')],
                        singleCurrency: true  // 個別分析フラグ
                    })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    
                    // 結果をモーダルで表示（個別分析用のフォーマット）
                    showSingleCurrencyAnalysis(result.data[0], symbol, currentPrice);
                    
                } else {
                    const error = await response.text();
                    alert(`❌ 分析に失敗しました: ${error}`);
                }
            } catch (error) {
                console.error('個別分析エラー:', error);
                alert('❌ 分析エラーが発生しました');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '🔍 AI分析';
            }
        }
        
        // 個別通貨の分析結果表示
        function showSingleCurrencyAnalysis(result, symbol, currentPrice) {
            const modal = document.getElementById('aiAnalysisModal');
            const content = document.getElementById('aiAnalysisContent');
            
            if (!result) {
                content.innerHTML = '<div style="color: #ff0040; text-align: center; padding: 2rem;">分析結果の取得に失敗しました</div>';
                modal.style.display = 'block';
                return;
            }
            
            const score = result.score || 0;
            const recommendation = result.recommendation || 'HOLD';
            const reasoning = result.reasoning || '分析データが不足しています';
            const keyFactors = result.keyFactors || [];
            const strategy = result.tradingStrategy || {};
            const technicalIndicators = result.technicalIndicators || {};
            
            content.innerHTML = `
                <div style="color: #00ff41; font-family: 'M PLUS 1 Code', monospace;">
                    <h3 style="color: #ffaa00; margin-bottom: 1rem;">🎯 ${symbol} 個別AI分析</h3>
                    
                    <!-- 総合評価 -->
                    <div style="background: rgba(0, 255, 65, 0.05); border: 2px solid ${
                        score >= 75 ? '#ff0040' : 
                        score >= 60 ? '#ffaa00' : 
                        'rgba(0, 255, 65, 0.3)'
                    }; padding: 1.5rem; border-radius: 8px; margin-bottom: 1.5rem;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                            <div>
                                <h4 style="color: #00ff41; margin-bottom: 0.5rem; font-size: 1.5rem;">
                                    ${symbol}
                                </h4>
                                <div style="color: rgba(0, 255, 65, 0.7); font-size: 1rem;">
                                    現在価格: $${currentPrice.toLocaleString()}
                                </div>
                            </div>
                            <div style="text-align: center;">
                                <div style="font-size: 3rem; font-weight: bold; color: ${
                                    score >= 75 ? '#ff0040' : 
                                    score >= 60 ? '#ffaa00' : 
                                    '#00ff41'
                                }; text-shadow: 0 0 20px currentColor;">${score}点</div>
                                <div style="font-size: 1rem; color: rgba(0, 255, 65, 0.6);">買い度指数</div>
                            </div>
                        </div>
                        
                        <!-- AI推奨 -->
                        <div style="background: ${recommendation === 'BUY' ? 'rgba(0, 255, 65, 0.2)' : 'rgba(0, 0, 0, 0.5)'}; 
                                    border: 1px solid ${recommendation === 'BUY' ? '#00ff41' : 'rgba(0, 255, 65, 0.3)'}; 
                                    padding: 1rem; border-radius: 4px; margin-bottom: 1rem;">
                            <div style="font-weight: bold; margin-bottom: 0.5rem; font-size: 1.2rem;">
                                🤖 AI推奨: <span style="color: ${
                                    recommendation === 'BUY' ? '#00ff41' : 
                                    recommendation === 'SELL' ? '#ff0040' : 
                                    '#ffaa00'
                                }">${recommendation}</span>
                            </div>
                            <p style="color: rgba(0, 255, 65, 0.8); line-height: 1.6;">
                                ${reasoning}
                            </p>
                        </div>
                    </div>
                    
                    <!-- 詳細トレーディング戦略 -->
                    ${strategy.entry || strategy.dca || strategy.profitTargets || strategy.stopLoss ? `
                    <div style="background: rgba(255, 170, 0, 0.05); border: 1px solid rgba(255, 170, 0, 0.3); padding: 1.5rem; border-radius: 8px; margin-bottom: 1.5rem;">
                        <h4 style="color: #ffaa00; margin-bottom: 1rem;">📊 詳細トレーディング戦略</h4>
                        
                        ${strategy.entry ? `
                        <div style="margin-bottom: 1.5rem;">
                            <h5 style="color: #00ff41; margin-bottom: 0.5rem;">エントリーポイント</h5>
                            <div style="background: rgba(0, 0, 0, 0.5); padding: 1rem; border-radius: 4px;">
                                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
                                    <div>
                                        <div style="color: rgba(0, 255, 65, 0.6); font-size: 0.85rem;">推奨エントリー価格</div>
                                        <div style="color: #00ff41; font-size: 1.2rem; font-weight: bold;">
                                            $${strategy.entry.price?.toFixed(2) || currentPrice.toFixed(2)}
                                        </div>
                                    </div>
                                    <div>
                                        <div style="color: rgba(0, 255, 65, 0.6); font-size: 0.85rem;">推奨ポジションサイズ</div>
                                        <div style="color: #ffaa00; font-size: 1.2rem; font-weight: bold;">
                                            ${strategy.entry.position || '資金の10-20%'}
                                        </div>
                                    </div>
                                    <div>
                                        <div style="color: rgba(0, 255, 65, 0.6); font-size: 0.85rem;">タイミング</div>
                                        <div style="color: #00ff41; font-size: 1.2rem; font-weight: bold;">
                                            ${strategy.entry.timing || '即時'}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        ` : ''}
                        
                        ${strategy.dca && strategy.dca.length > 0 ? `
                        <div style="margin-bottom: 1.5rem;">
                            <h5 style="color: #00ff41; margin-bottom: 0.5rem;">🎯 ドルコスト平均法（DCA）戦略</h5>
                            <div style="background: rgba(0, 0, 0, 0.5); padding: 1rem; border-radius: 4px;">
                                <table style="width: 100%; border-collapse: collapse;">
                                    <thead>
                                        <tr style="border-bottom: 1px solid rgba(0, 255, 65, 0.3);">
                                            <th style="padding: 0.5rem; text-align: left; color: #ffaa00;">価格</th>
                                            <th style="padding: 0.5rem; text-align: left; color: #ffaa00;">現在価格から</th>
                                            <th style="padding: 0.5rem; text-align: left; color: #ffaa00;">推奨購入額</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${strategy.dca.map(level => `
                                        <tr style="border-bottom: 1px solid rgba(0, 255, 65, 0.1);">
                                            <td style="padding: 0.5rem; color: #00ff41;">$${level.price.toFixed(2)}</td>
                                            <td style="padding: 0.5rem; color: ${level.percentage < 0 ? '#ff0040' : '#00ff41'};">
                                                ${level.percentage}%
                                            </td>
                                            <td style="padding: 0.5rem; color: rgba(0, 255, 65, 0.8);">${level.amount}</td>
                                        </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        ` : ''}
                        
                        ${strategy.profitTargets && strategy.profitTargets.length > 0 ? `
                        <div style="margin-bottom: 1.5rem;">
                            <h5 style="color: #00ff41; margin-bottom: 0.5rem;">💰 利益確定目標</h5>
                            <div style="background: rgba(0, 0, 0, 0.5); padding: 1rem; border-radius: 4px;">
                                ${strategy.profitTargets.map((target, index) => `
                                <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.5rem; 
                                            ${index < strategy.profitTargets.length - 1 ? 'border-bottom: 1px solid rgba(0, 255, 65, 0.1);' : ''}">
                                    <div>
                                        <span style="color: #ffaa00;">目標${index + 1}:</span>
                                        <span style="color: #00ff41; font-weight: bold; margin-left: 0.5rem;">
                                            $${target.price.toFixed(2)}
                                        </span>
                                        <span style="color: rgba(0, 255, 65, 0.6); margin-left: 0.5rem;">
                                            (+${target.percentage}%)
                                        </span>
                                    </div>
                                    <div style="color: rgba(0, 255, 65, 0.8);">
                                        ${target.sellRatio}
                                    </div>
                                </div>
                                `).join('')}
                            </div>
                        </div>
                        ` : ''}
                        
                        ${strategy.stopLoss ? `
                        <div>
                            <h5 style="color: #ff0040; margin-bottom: 0.5rem;">⛔ リスク管理（ストップロス）</h5>
                            <div style="background: rgba(255, 0, 64, 0.1); border: 1px solid rgba(255, 0, 64, 0.3); padding: 1rem; border-radius: 4px;">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <div>
                                        <div style="color: rgba(255, 0, 64, 0.8); font-size: 0.85rem;">推奨損切りライン</div>
                                        <div style="color: #ff0040; font-size: 1.5rem; font-weight: bold;">
                                            $${strategy.stopLoss.price.toFixed(2)}
                                        </div>
                                    </div>
                                    <div style="text-align: right;">
                                        <div style="color: rgba(255, 0, 64, 0.8); font-size: 0.85rem;">最大損失</div>
                                        <div style="color: #ff0040; font-size: 1.2rem; font-weight: bold;">
                                            ${strategy.stopLoss.percentage}%
                                        </div>
                                    </div>
                                </div>
                                <p style="color: rgba(255, 0, 64, 0.6); margin-top: 0.5rem; font-size: 0.85rem;">
                                    ${strategy.stopLoss.reason || '重要なサポートレベルを下回った場合、損失を限定するため'}
                                </p>
                            </div>
                        </div>
                        ` : ''}
                    </div>
                    ` : ''}
                    
                    <!-- テクニカル指標詳細 -->
                    ${technicalIndicators ? `
                    <div style="background: rgba(0, 255, 65, 0.05); border: 1px solid rgba(0, 255, 65, 0.3); padding: 1.5rem; border-radius: 8px; margin-bottom: 1.5rem;">
                        <h4 style="color: #00ff41; margin-bottom: 1rem;">📈 テクニカル指標詳細</h4>
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem;">
                            ${Object.entries(technicalIndicators).map(([key, value]) => `
                            <div style="background: rgba(0, 0, 0, 0.5); padding: 1rem; border-radius: 4px; text-align: center;">
                                <div style="color: rgba(0, 255, 65, 0.6); font-size: 0.85rem; margin-bottom: 0.3rem;">
                                    ${key.toUpperCase()}
                                </div>
                                <div style="color: #00ff41; font-size: 1.5rem; font-weight: bold;">
                                    ${typeof value === 'number' ? value.toFixed(2) : value}
                                </div>
                            </div>
                            `).join('')}
                        </div>
                    </div>
                    ` : ''}
                    
                    <!-- 重要ファクター -->
                    ${keyFactors && keyFactors.length > 0 ? `
                    <div style="background: rgba(0, 255, 65, 0.05); border: 1px solid rgba(0, 255, 65, 0.3); padding: 1.5rem; border-radius: 8px; margin-bottom: 1.5rem;">
                        <h4 style="color: #00ff41; margin-bottom: 1rem;">🎯 重要な判断要因</h4>
                        <ul style="color: rgba(0, 255, 65, 0.8); line-height: 1.8;">
                            ${keyFactors.map(factor => `<li>${factor}</li>`).join('')}
                        </ul>
                    </div>
                    ` : ''}
                    
                    <!-- 免責事項 -->
                    <div style="text-align: center; margin-top: 2rem; padding: 1rem; background: rgba(255, 0, 64, 0.05); border: 1px solid rgba(255, 0, 64, 0.3); border-radius: 4px;">
                        <p style="color: rgba(255, 0, 64, 0.8); font-size: 0.85rem; margin: 0;">
                            ⚠️ これは参考情報です。投資判断は自己責任でお願いします。<br>
                            必ず余剰資金で投資を行い、リスク管理を徹底してください。
                        </p>
                    </div>
                </div>
            `;
            
            modal.style.display = 'block';
        }
    </script>
</body>
</html>
